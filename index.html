<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header h2 {
            color: #1a1a1a;
            font-size: 20px;
            font-weight: 600;
        }
        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }
        .info-group {
            margin-bottom: 16px;
        }
        .info-label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .info-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px 14px;
            border-radius: 10px;
        }
        .info-text {
            font-size: 14px;
            color: #212529;
            font-weight: 500;
            word-break: break-all;
        }
        .copy-btn {
            background: #007bff;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-left: 10px;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: #0056b3;
        }
        .copy-btn.copied {
            background: #28a745;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Ödeme Bilgileri</h2>
        <p>Aşağıdaki butonları kullanarak bilgileri kopyalayabilirsiniz.</p>
    </div>

    <!-- İSİM SOYİSİM BÖLÜMÜ -->
    <div class="info-group">
        <span class="info-label">Alıcı Adı Soyadı</span>
        <div class="info-box">
            <span class="info-text" id="nameText">Ahmet Yılmaz</span>
            <button class="copy-btn" onclick="copyData('nameText', this)">Kopyala</button>
        </div>
    </div>

    <!-- IBAN BÖLÜMÜ -->
    <div class="info-group">
        <span class="info-label">IBAN Numarası</span>
        <div class="info-box">
            <span class="info-text" id="ibanText">TR00 0000 0000 0000 0000 0000 00</span>
            <button class="copy-btn" onclick="copyData('ibanText', this)">Kopyala</button>
        </div>
    </div>
</div>

<script>
    function copyData(elementId, btn) {
        const textToCopy = document.getElementById(elementId).innerText;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Kopyalandı!";
            btn.classList.add("copied");
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove("copied");
            }, 2000);
        }).catch(err => {
            console.error('Kopyalama hatası:', err);
        });
    }
</script>

</body>
</html>
